minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Official package (signed by the npm CLI team), flagged by no-downgrade only
  # because it predates the attestation era.
  - semver@6.3.1
  # The Pierre team switched release pipelines at 2.x and ships no npm provenance
  # yet, which trips no-downgrade against 1.x. Exclude exactly this version; a
  # component of @pierre/diffs depends on it.
  - '@pierre/theme@2.1.0'

shellEmulator: true

allowBuilds:
  # Postinstall advertising only, never run it.
  core-js: false
  # Required by the vite / astro build chain.
  esbuild: true
  # Required by the Cloudflare adapter and the local wrangler runtime.
  workerd: true
